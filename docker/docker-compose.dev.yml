# Runs on a remote docker host (no bind mounts): everything is baked into images.
#   DOCKER_CONTEXT=remote-builder docker compose -f docker/docker-compose.dev.yml up -d --build
name: torrcatalog-dev
services:
  jellyfin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["8096:8096"]
    environment:
      # Stand-in stream for every catalog movie until TorrServer playback exists.
      # Must be reachable from clients (browser, TV), not just from the server.
      TORRCATALOG_DEV_STREAM_URL: ${DEV_STREAM_URL:-http://192.168.88.95:8091/test.mp4}
      # Jellyfin probes .strm targets (the Phase 7 fallback) with -analyzeduration 200M / -probesize 1G by
      # default: on a torrent that's minutes of download before playback. Note: applies to all libraries.
      JELLYFIN_FFmpeg__analyzeduration: "5M"
      JELLYFIN_FFmpeg__probesize: "50M"
    volumes:
      - config:/config
      - cache:/cache
    restart: unless-stopped
  media:
    build:
      context: ..
      dockerfile: docker/media.Dockerfile
    ports: ["8091:80"]
    restart: unless-stopped
  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.145.2
    # No HTTP auth in dev (LAN only). Set TS_HTTPAUTH=1 + accs.db to protect it.
    ports: ["8090:8090"]
    volumes:
      - torrserver:/opt/ts
    restart: unless-stopped
volumes:
  config: {}
  cache: {}
  torrserver: {}
